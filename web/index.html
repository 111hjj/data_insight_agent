<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据洞察 Agent - 多智能体数据分析平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #4A90E2;
            --primary-hover: #357ABD;
            --secondary-color: #7F8C8D;
            --accent-color: #52C41A;
            --bg-start: #FFFFFF;
            --bg-end: #F7F9FC;
            --header-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --border-color: #E8ECF1;
            --text-primary: #2C3E50;
            --text-secondary: #7F8C8D;
            --success-color: #52C41A;
        }
        @layer utilities {
            .scrollbar-thin {
                scrollbar-width: thin;
                scrollbar-color: #CBD5E1 transparent;
            }
            .scrollbar-thin::-webkit-scrollbar {
                width: 6px;
            }
            .scrollbar-thin::-webkit-scrollbar-track {
                background: transparent;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb {
                background-color: #CBD5E1;
                border-radius: 3px;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb:hover {
                background-color: #94A3B8;
            }
            .color-primary {
                color: var(--primary-color);
            }
            .bg-primary {
                background-color: var(--primary-color);
            }
            .bg-header {
                background: var(--header-bg);
            }
            .border-custom {
                border-color: var(--border-color);
            }
            .break-words {
                word-break: break-all;
                overflow-wrap: break-word;
                white-space: pre-wrap;
                max-width: 100%;
            }
        }
        .chat-bubble-user {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
        }
        .chat-bubble-assistant {
            background: #F7F9FC;
            border: 1px solid #E8ECF1;
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="h-screen flex bg-gradient-to-br from-slate-50 to-slate-100 overflow-hidden">
    <div class="flex h-full w-full">
        <aside class="w-72 flex-shrink-0 bg-white border-r border-slate-200 flex flex-col shadow-sm">
            <div class="p-4 bg-white border-b border-slate-200">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-blue-500 rounded-xl flex items-center justify-center shadow-sm">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-800">数据洞察 Agent</h1>
                        <p class="text-xs text-gray-500">多智能体数据分析平台</p>
                    </div>
                </div>
            </div>

            <div class="p-3 border-b border-slate-200">
                <button onclick="createNewConversation()" class="w-full px-4 py-2.5 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all font-medium text-sm shadow-sm">
                    <div class="flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        新建对话
                    </div>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto scrollbar-thin p-2" id="conversation-list">
                <div class="text-center text-slate-400 py-8 text-sm">暂无对话记录</div>
            </div>

            <div class="border-t border-slate-200 p-4">
                <div class="mb-3">
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-medium text-slate-500">📁 数据文件</label>
                        <span id="selected-count" class="text-xs text-blue-600 font-medium">已选 0 个</span>
                    </div>
                    <div class="relative">
                        <button onclick="document.getElementById('file-upload').click()" class="w-full px-4 py-3 border-2 border-dashed border-slate-200 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-all flex items-center justify-center gap-2 text-sm text-slate-500 group">
                            <svg class="w-4 h-4 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            选择文件上传
                        </button>
                        <input type="file" id="file-upload" accept=".csv,.xlsx,.xls" class="hidden" onchange="handleFileUpload(event)">
                    </div>
                    <p class="text-xs text-slate-400 mt-1">💡 点击文件可多选，同时分析多个数据集</p>
                </div>

                <div id="uploaded-files" class="space-y-2">
                </div>
            </div>

            <div class="border-t border-slate-200 p-4">
                <label class="block text-xs font-medium text-slate-500 mb-2">⚡ 分析模式</label>
                <div class="flex gap-2">
                    <button id="quick-analysis-btn" onclick="setAnalysisMode('quick')" class="flex-1 px-3 py-2 bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 transition-all text-xs font-medium border border-blue-200">
                        快速分析
                    </button>
                    <button id="deep-analysis-btn" onclick="setAnalysisMode('deep')" class="flex-1 px-3 py-2 bg-slate-50 text-slate-600 rounded-lg hover:bg-slate-100 transition-all text-xs font-medium border border-slate-200">
                        深度分析
                    </button>
                </div>
            </div>

            <div class="border-t border-slate-200 p-4 bg-slate-50">
                <label class="block text-xs font-medium text-slate-500 mb-2">🔧 快捷功能</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="addQuickAction('数据预览')" class="p-2.5 bg-white border border-slate-200 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-all text-center">
                        <svg class="w-5 h-5 mx-auto text-blue-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <span class="text-xs text-slate-600">预览</span>
                    </button>
                    <button onclick="addQuickAction('生成图表')" class="p-2.5 bg-white border border-slate-200 rounded-lg hover:border-emerald-400 hover:bg-emerald-50 transition-all text-center">
                        <svg class="w-5 h-5 mx-auto text-emerald-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path>
                        </svg>
                        <span class="text-xs text-slate-600">图表</span>
                    </button>
                    <button onclick="addQuickAction('描述统计')" class="p-2.5 bg-white border border-slate-200 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-all text-center">
                        <svg class="w-5 h-5 mx-auto text-blue-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        <span class="text-xs text-slate-600">统计</span>
                    </button>
                    <button onclick="addQuickAction('相关性分析')" class="p-2.5 bg-white border border-slate-200 rounded-lg hover:border-cyan-400 hover:bg-cyan-50 transition-all text-center">
                        <svg class="w-5 h-5 mx-auto text-cyan-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                        <span class="text-xs text-slate-600">相关</span>
                    </button>
                    <button onclick="addQuickAction('异常检测')" class="p-2.5 bg-white border border-slate-200 rounded-lg hover:border-amber-400 hover:bg-amber-50 transition-all text-center">
                        <svg class="w-5 h-5 mx-auto text-amber-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <span class="text-xs text-slate-600">异常</span>
                    </button>
                    <button onclick="addQuickAction('趋势分析')" class="p-2.5 bg-white border border-slate-200 rounded-lg hover:border-emerald-400 hover:bg-emerald-50 transition-all text-center">
                        <svg class="w-5 h-5 mx-auto text-emerald-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                        <span class="text-xs text-slate-600">趋势</span>
                    </button>
                </div>
            </div>

            <div class="border-t border-slate-200 p-3 bg-slate-50">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span>控制台日志</span>
                    <button onclick="clearConsole()" class="hover:text-slate-600 transition-colors">
                        清空
                    </button>
                </div>
                <div id="console-log" class="mt-2 h-16 overflow-y-auto scrollbar-thin text-xs text-slate-500 font-mono"></div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-slate-50">
            <header class="flex items-center justify-between px-6 py-4 bg-white border-b border-slate-200 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
                    <span class="text-sm text-slate-600">系统就绪</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-blue-50 rounded-full">
                        <span class="text-xs text-blue-600">当前模式:</span>
                        <span id="current-mode" class="text-sm font-medium text-blue-700">快速分析</span>
                    </div>
                    <button onclick="document.getElementById('settings-modal').style.display = 'flex'" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto scrollbar-thin p-6 space-y-4">
                <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center">
                    <div class="w-24 h-24 bg-gradient-to-br from-blue-100 to-blue-50 rounded-full flex items-center justify-center mb-4">
                        <svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <p class="text-lg text-gray-700 font-medium">选择数据文件开始分析</p>
                    <p class="text-sm text-gray-400 mt-2">支持多文件选择，同时分析多个数据集</p>
                    <div class="mt-6 flex flex-wrap justify-center gap-2">
                        <button onclick="addQuickAction('数据集中包含多少行记录？')" class="px-4 py-2 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:bg-blue-50 hover:border-blue-300 transition-all shadow-sm">
                            数据集中包含多少行记录？
                        </button>
                        <button onclick="addQuickAction('各列数据的空值分布情况如何？')" class="px-4 py-2 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:bg-blue-50 hover:border-blue-300 transition-all shadow-sm">
                            各列数据的空值分布情况如何？
                        </button>
                        <button onclick="addQuickAction('对比各文件的数据特征')" class="px-4 py-2 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:bg-blue-50 hover:border-blue-300 transition-all shadow-sm">
                            对比各文件的数据特征
                        </button>
                    </div>
                </div>
            </div>

            <footer class="px-6 py-4 bg-white border-t border-slate-200">
                <div class="flex items-end gap-3">
                    <div class="flex-1 relative">
                        <textarea id="message-input" placeholder="输入您的数据分析问题..."
                            class="w-full px-4 py-3 pr-12 border border-slate-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent text-sm shadow-sm"
                            rows="2"></textarea>
                        <button onclick="clearInput()" class="absolute right-3 bottom-3 text-slate-400 hover:text-slate-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <button onclick="searchQuery()" class="p-3 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all">
                        <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
                        </svg>
                    </button>
                    <button onclick="sendMessage()" class="p-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-all shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                    </button>
                </div>
                <p class="text-xs text-slate-400 mt-2">Enter 发送 · Shift+Enter 换行</p>
            </footer>
        </main>
    </div>

    <div id="preview-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full mx-4 max-h-[80vh] overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900">数据预览</h3>
                        <p id="preview-dimensions" class="text-sm text-gray-500">12 行 × 7 列</p>
                    </div>
                </div>
                <button onclick="closePreviewModal()" class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="preview-tabs" class="px-6 pt-2 border-b border-gray-100 flex gap-1 overflow-x-auto hidden"></div>
            <div id="preview-content" class="p-6 overflow-y-auto max-h-[60vh]">
                <div class="flex items-center justify-center py-12">
                    <div class="w-8 h-8 border-4 border-blue-200 rounded-full animate-spin"></div>
                </div>
                <p class="text-center text-gray-500">加载中...</p>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-900">设置</h3>
                <button onclick="document.getElementById('settings-modal').style.display = 'none'" class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">AI 模型</label>
                    <select id="model-select" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="ollama">Ollama (本地)</option>
                        <option value="openai">OpenAI API</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">OpenAI API Key</label>
                    <input type="password" id="api-key" placeholder="输入您的 OpenAI API Key" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ollama 模型名称</label>
                    <input type="text" id="ollama-model" value="qwen2.5:14b" placeholder="例如: qwen2.5:14b" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>
            <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-100">
                <button onclick="document.getElementById('settings-modal').style.display = 'none'" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-xl transition-colors">
                    取消
                </button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl hover:from-blue-600 hover:to-blue-700 transition-all">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        let selectedFileIds = [];
        let currentConversationId = null;
        let analysisMode = 'quick';
        let isLoading = false;
        let loadedFileNames = new Set();
        let fileInfoMap = {};

        function getFileNameById(fileId) {
            const info = fileInfoMap[fileId];
            return info ? info.filename : fileId.substring(0, 12);
        }

        function logToConsole(message) {
            const consoleLog = document.getElementById('console-log');
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            const logItem = document.createElement('div');
            logItem.className = 'text-xs text-gray-500';
            logItem.textContent = `[${timestamp}] ${message}`;
            consoleLog.appendChild(logItem);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = `已选 ${selectedFileIds.length} 个`;
        }

        function toggleFileSelection(fileId) {
            const index = selectedFileIds.indexOf(fileId);
            if (index > -1) {
                selectedFileIds.splice(index, 1);
            } else {
                selectedFileIds.push(fileId);
            }
            updateAllFileItems();
            updateSelectedCount();
            logToConsole(`当前选中 ${selectedFileIds.length} 个文件`);
        }

        function updateAllFileItems() {
            document.querySelectorAll('#uploaded-files > div').forEach(el => {
                const fileId = el.getAttribute('data-file-id');
                const isSelected = selectedFileIds.includes(fileId);
                const checkbox = el.querySelector('.file-checkbox');
                
                if (isSelected) {
                    el.className = 'flex items-center justify-between p-3 bg-slate-50 border border-slate-300 rounded-lg shadow-sm';
                    if (checkbox) {
                        checkbox.className = 'file-checkbox w-5 h-5 bg-blue-600 border-blue-600 rounded-full flex items-center justify-center';
                        checkbox.innerHTML = `<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                    }
                } else {
                    el.className = 'flex items-center justify-between p-3 bg-white border border-gray-200 rounded-lg hover:border-slate-300 hover:shadow-sm transition-all';
                    if (checkbox) {
                        checkbox.className = 'file-checkbox w-5 h-5 border-2 border-gray-300 rounded-full flex items-center justify-center';
                        checkbox.innerHTML = '';
                    }
                }
            });
        }

        function createFileItem(result, isSelected, label) {
            const filesContainer = document.getElementById('uploaded-files');
            const fileItem = document.createElement('div');
            fileItem.setAttribute('data-file-id', result.file_id);
            fileItem.className = isSelected 
                ? 'flex items-center justify-between p-3 bg-slate-50 border border-slate-300 rounded-lg shadow-sm'
                : 'flex items-center justify-between p-3 bg-white border border-gray-200 rounded-lg hover:border-slate-300 hover:shadow-sm transition-all';
            fileItem.innerHTML = `
                <div class="flex items-center gap-2">
                    <div class="file-checkbox ${isSelected ? 'w-5 h-5 bg-blue-600 border-blue-600' : 'w-5 h-5 border-2 border-gray-300'} rounded-full flex items-center justify-center">
                        ${isSelected ? `<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>` : ''}
                    </div>
                    <div>
                        <span class="text-sm font-medium text-gray-700">${result.filename}</span>
                        ${label ? `<span class="inline-block ml-2 text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">${label}</span>` : ''}
                    </div>

        }

        function addMessage(role, content, code = null, chartPath = null, reportPath = null) {
            const chatContainer = document.getElementById('chat-container');
            document.getElementById('empty-state').style.display = 'none';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
            
            let bubbleContent = `<div class="${role === 'user' ? 'chat-bubble-user text-white' : 'chat-bubble-assistant border border-gray-200'} px-4 py-3 rounded-2xl max-w-[70%] shadow-sm">`;
            
            if (role === 'user') {
                bubbleContent += `<p class="text-sm">${content}</p>`;
            } else {
                bubbleContent += `<div class="flex items-start gap-2">
                    <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-400 to-blue-500 flex items-center justify-center flex-shrink-0 mt-0.5">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <div class="flex-1 break-words">`;
                
                if (content.includes('```') || content.includes('##') || content.includes('###') || content.includes('![')) {
                    bubbleContent += `<div class="text-sm text-gray-800 break-words">${renderMarkdown(content)}</div>`;
                } else if (isTableData(content)) {
                    bubbleContent += `<div class="text-sm text-gray-800 break-words">${renderTable(content)}</div>`;
                } else {
                    bubbleContent += `<p class="text-sm text-gray-800 break-words">${content}</p>`;
                }
                
                if (code) {
                    bubbleContent += `<div class="mt-2 p-2 bg-gray-900 rounded-lg overflow-x-auto">
                        <code class="text-xs text-green-400">${code}</code>
                    </div>`;
                }
                
                if (chartPath) {
                    bubbleContent += `<div class="mt-3">
                        <img src="${chartPath}" alt="图表" class="max-w-full rounded-lg shadow-sm"/>
                    </div>`;
                }
                
                if (reportPath) {
                    bubbleContent += `<div class="mt-3">
                        <a href="${reportPath}" download class="inline-flex items-center gap-1 px-3 py-1.5 bg-blue-500 text-white text-xs rounded-lg hover:bg-blue-600 transition-colors">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            下载报告
                        </a>
                    </div>`;
                }
                
                bubbleContent += `</div></div>`;
            }
            
            bubbleContent += '</div>';
            messageDiv.innerHTML = bubbleContent;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function renderMarkdown(text) {
            text = text.replace(/### (.+)/g, '<h3 class="font-semibold text-gray-900 mt-3 mb-1">$1</h3>');
            text = text.replace(/## (.+)/g, '<h2 class="font-bold text-gray-900 text-base mt-4 mb-2">$1</h2>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre class="bg-gray-900 text-green-400 p-3 rounded-lg text-xs overflow-x-auto mt-2 mb-2"><code>$2</code></pre>');
            text = text.replace(/`([^`]+)`/g, '<code class="bg-gray-100 px-1.5 py-0.5 rounded text-xs">$1</code>');
            text = text.replace(/!\[([^\]]+)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="max-w-full rounded-lg mt-2 mb-2" />');
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-blue-600 hover:underline">$1</a>');
            text = text.replace(/^- (.+)$/gm, '<li class="ml-4 text-gray-700">$1</li>');
            return text;
        }

        function isTableData(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return false;
            const headerParts = lines[0].trim().split(/\s{2,}|\t/);
            return headerParts.length >= 3 && lines.length >= 3;
        }

        function renderTable(text) {
            const lines = text.trim().split('\n').filter(l => l.trim());
            if (lines.length < 2) return `<p class="text-sm text-gray-800 break-words">${text}</p>`;
            
            const headers = lines[0].trim().split(/\s{2,}|\t/).map(h => h.trim());
            
            let tableHtml = `<div class="overflow-x-auto mt-2">
                <table class="min-w-full border border-gray-200 rounded-lg">
                    <thead class="bg-gray-50">
                        <tr>`;
            headers.forEach(h => {
                tableHtml += `<th class="px-3 py-2 text-xs font-semibold text-gray-700 border-b border-gray-200">${h}</th>`;
            });
            tableHtml += `</tr></thead><tbody class="divide-y divide-gray-100">`;
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].trim().split(/\s{2,}|\t/).map(v => v.trim());
                if (values.length < headers.length && values[0] === '') continue;
                const rowClass = i % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                tableHtml += `<tr class="${rowClass}">`;
                for (let j = 0; j < Math.min(values.length, headers.length); j++) {
                    tableHtml += `<td class="px-3 py-2 text-xs text-gray-600 border-b border-gray-100">${values[j] || ''}</td>`;
                }
                tableHtml += '</tr>';
            }
            
            tableHtml += `</tbody></table></div>`;
            return tableHtml;
        }

            document.getElementById('chat-container').innerHTML = `

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>

                            数据集中包含多少行记录？

        function clearConsole() {
            document.getElementById('console-log').innerHTML = '';
        }

        function loadSampleDataOnStartup() {
            const sampleFiles = [
                { url: '/web/sales_data.csv', name: 'sales_data.csv', defaultSelected: true, label: '正常' },
                { url: '/web/sales_anomaly_test.csv', name: 'sales_anomaly_test.csv', defaultSelected: false, label: '测试' }
            ];
            
            sampleFiles.forEach((sampleFile) => {
                fetch(sampleFile.url)
                    .then(response => response.text())
                    .then(csvContent => {
                        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                        const file = new File([blob], sampleFile.name, { type: 'text/csv' });
                        
                        const formData = new FormData();
                        formData.append('file', file);
                        
                        return fetch('/api/documents/upload', {
                            method: 'POST',
                            body: formData
                        });
                    })
                    .then(response => response.json())
                    .then(result => {
                        if (result.success || result.file_id) {
                            fileInfoMap[result.file_id] = result;
                            
                            if (sampleFile.defaultSelected) {
                                selectedFileIds.push(result.file_id);
                                updateSelectedCount();
                            }
                            
                            logToConsole(`示例数据已加载: ${result.filename} (${result.rows}行)`);
                            
                            const fileItem = createFileItem(result, sampleFile.defaultSelected, sampleFile.label);
                            document.getElementById('uploaded-files').appendChild(fileItem);
                        }
                    })
                    .catch(error => {
                        logToConsole(`${sampleFile.name} 加载失败: ${error.message}`);
                    });
            });
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            logToConsole(`准备上传文件: ${file.name}`);

            const formData = new FormData();
            formData.append('file', file);

            fetch('/api/documents/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.success || result.file_id) {
                    fileInfoMap[result.file_id] = result;
                    selectedFileIds.push(result.file_id);
                    updateSelectedCount();
                    
                    logToConsole(`文件上传成功: ${result.filename} (${result.rows}行)`);
                    
                    const fileItem = createFileItem(result, true);
                    document.getElementById('uploaded-files').prepend(fileItem);
                } else {
                    logToConsole(`上传失败: ${result.error || '未知错误'}`);
                    alert('上传失败: ' + (result.error || '未知错误'));
                }
            })
            .catch(error => {
                logToConsole(`上传失败: ${error.message}`);
                alert('上传失败: ' + error.message);
            });

            event.target.value = '';
        }

        function setAnalysisMode(mode) {
            analysisMode = mode;
            document.getElementById('current-mode').textContent = mode === 'quick' ? '快速分析' : '深度分析';
            document.getElementById('quick-analysis-btn').className = mode === 'quick' 
                ? 'flex-1 px-3 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition-all text-xs font-medium border border-slate-200'
                : 'flex-1 px-3 py-2 bg-gray-50 text-gray-600 rounded-lg hover:bg-gray-100 transition-all text-xs font-medium border border-gray-200';
            document.getElementById('deep-analysis-btn').className = mode === 'deep' 
                ? 'flex-1 px-3 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition-all text-xs font-medium border border-slate-200'
                : 'flex-1 px-3 py-2 bg-gray-50 text-gray-600 rounded-lg hover:bg-gray-100 transition-all text-xs font-medium border border-gray-200';
        }

        function addQuickAction(action) {
            if (action === '数据预览') {
                openDataPreview();
                return;
            }
            document.getElementById('message-input').value = action;
        }

        function clearInput() {
            document.getElementById('message-input').value = '';
        }

        function searchQuery() {
            sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (!message || isLoading) return;
            if (selectedFileIds.length === 0) {
                alert('请先选择至少一个数据文件');
                return;
            }

            isLoading = true;
            input.value = '';
            addMessage('user', message);

            logToConsole(`发送查询: ${message}（${selectedFileIds.length}个文件）`);

            const url = analysisMode === 'quick' 
                ? '/api/chat/completions' 
                : '/api/data-analysis/deep-analysis';

            const bodyData = analysisMode === 'quick' 
                ? { messages: [{ role: 'user', content: message }], file_id: selectedFileIds[0], file_ids: selectedFileIds }
                : { message: message, file_id: selectedFileIds[0], file_ids: selectedFileIds, conversation_id: currentConversationId };
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                if (analysisMode === 'quick') {
                    return response.json();
                } else {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    
                    let buffer = '';
                    
                    return new Promise((resolve) => {
                        function read() {
                            reader.read().then(({ done, value }) => {
                                if (done) {
                                    isLoading = false;
                                    resolve(null);
                                    return;
                                }
                                
                                buffer += decoder.decode(value, { stream: true });
                                
                                while (buffer.includes('\n')) {
                                    const index = buffer.indexOf('\n');
                                    const line = buffer.substring(0, index);
                                    buffer = buffer.substring(index + 1);
                                    
                                    if (line.trim()) {
                                        try {
                                            const data = JSON.parse(line);
                                            handleStreamMessage(data);
                                        } catch (e) {
                                            logToConsole(`解析响应失败: ${e.message}`);
                                        }
                                    }
                                }
                                
                                read();
                            });
                        }
                        
                        read();
                    });
                }
            })
            .then(result => {
                if (analysisMode === 'quick' && result) {
                    isLoading = false;
                    if (result.success) {
                        if (result.chart_base64) {
                            const chartHtml = `<img src="data:image/png;base64,${result.chart_base64}" class="max-w-full rounded-lg" />`;
                            addMessage('assistant', result.content + '<br/>' + chartHtml);
                        } else {
                            addMessage('assistant', result.content);
                        }
                    } else {
                        addMessage('assistant', `❌ 错误: ${result.error}`);
                    }
                }
            })
            .catch(error => {
                isLoading = false;
                logToConsole(`请求失败: ${error.message}`);
                addMessage('assistant', `请求失败: ${error.message}`);
            });
        }

        function handleStreamMessage(data) {
            if (data.type === 'agent_result') {
                addMessage('assistant', data.content, null, data.chart_path, data.report_path);
            } else if (data.type === 'direct_answer') {
                addMessage('assistant', data.content);
            } else if (data.type === 'error') {
                addMessage('assistant', `❌ 错误: ${data.error}`);
            } else if (data.type === 'done') {
                if (data.conversation_id) {
                    currentConversationId = data.conversation_id;
                }
                isLoading = false;
            } else if (data.type === 'planning') {
                addMessage('assistant', `🧠 ${data.reasoning}`);
            } else if (data.type === 'code') {
                addMessage('assistant', '', data.content);
            }
        }

        let previewCache = {};

        function openDataPreview() {
            if (selectedFileIds.length === 0) {
                alert('请先选择数据文件');
                return;
            }

            const modal = document.getElementById('preview-modal');
            const tabsContainer = document.getElementById('preview-tabs');
            const content = document.getElementById('preview-content');
            const dimensions = document.getElementById('preview-dimensions');

            previewCache = {};
            modal.style.display = 'flex';
            content.innerHTML = `<div class="flex items-center justify-center py-12"><div class="w-8 h-8 border-4 border-blue-200 rounded-full animate-spin"></div></div><p class="text-center text-gray-500">加载中...</p>`;

            if (selectedFileIds.length > 1) {
                tabsContainer.classList.remove('hidden');
                tabsContainer.innerHTML = selectedFileIds.map((id, idx) => {
                    const name = getFileNameById(id);
                    return `<button id="tab-${id}" onclick="switchPreviewTab('${id}')" class="px-3 py-1.5 text-xs font-medium rounded-lg transition-colors ${idx === 0 ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-100'}">${name}</button>`;
                }).join('');
            } else {
                tabsContainer.classList.add('hidden');
            }

            loadPreviewTab(selectedFileIds[0]);
        }

        function switchPreviewTab(fileId) {
            document.querySelectorAll('#preview-tabs button').forEach(btn => {
                btn.classList.remove('bg-blue-100', 'text-blue-700');
                btn.classList.add('text-gray-500', 'hover:bg-gray-100');
            });
            const activeTab = document.getElementById(`tab-${fileId}`);
            if (activeTab) {
                activeTab.classList.add('bg-blue-100', 'text-blue-700');
                activeTab.classList.remove('text-gray-500', 'hover:bg-gray-100');
            }
            loadPreviewTab(fileId);
        }

        function loadPreviewTab(fileId) {
            const content = document.getElementById('preview-content');
            const dimensions = document.getElementById('preview-dimensions');

            if (previewCache[fileId]) {
                renderPreviewTable(previewCache[fileId]);
                return;
            }

            content.innerHTML = `<div class="flex items-center justify-center py-12"><div class="w-8 h-8 border-4 border-blue-200 rounded-full animate-spin"></div></div><p class="text-center text-gray-500">加载中...</p>`;

            fetch(`/api/data-analysis/file/${fileId}/preview`)
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        previewCache[fileId] = result;
                        renderPreviewTable(result);
                    } else {
                        content.innerHTML = `<p class="text-center text-red-500">${result.error}</p>`;
                    }
                })
                .catch(error => {
                    content.innerHTML = `<p class="text-center text-red-500">加载失败: ${error.message}</p>`;
                });
        }

        function renderPreviewTable(result) {
            const content = document.getElementById('preview-content');
            const dimensions = document.getElementById('preview-dimensions');
            
            dimensions.textContent = `${result.rows} 行 × ${result.columns.length} 列`;
            
            let tableHtml = `
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-50">
            `;
            
            result.columns.forEach(col => {
                const dtype = result.dtypes ? result.dtypes[col] : '';
                tableHtml += `<th class="px-4 py-3 text-left text-sm font-semibold text-gray-700 border-b border-gray-200">${col}<br><span class="text-xs text-gray-500">${dtype}</span></th>`;
            });
            
            tableHtml += `</tr></thead><tbody>`;
            
            result.sample.forEach((row, index) => {
                const rowClass = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                tableHtml += `<tr class="${rowClass}">`;
                result.columns.forEach(col => {
                    const value = row[col] !== null && row[col] !== undefined ? row[col] : '';
                    tableHtml += `<td class="px-4 py-3 text-sm text-gray-900 border-b border-gray-200">${value}</td>`;
                });
                tableHtml += `</tr>`;
            });
            
            tableHtml += `</tbody></table></div>`;
            content.innerHTML = tableHtml;
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        function saveSettings() {
            const modelType = document.getElementById('model-select').value;
            const apiKey = document.getElementById('api-key').value;
            const ollamaModel = document.getElementById('ollama-model').value;
            
            localStorage.setItem('model_type', modelType);
            localStorage.setItem('api_key', apiKey);
            localStorage.setItem('ollama_model', ollamaModel);
            
            document.getElementById('settings-modal').style.display = 'none';
            alert('设置已保存');
        }

        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('preview-modal')) {
                closePreviewModal();
            }
            if (e.target === document.getElementById('settings-modal')) {
                document.getElementById('settings-modal').style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadSampleDataOnStartup();
        });
    </script>
